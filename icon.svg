<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Swarm rebuild">
  <defs>
    <linearGradient id="swarm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2440"/>
      <stop offset="1" stop-color="#0d1226"/>
    </linearGradient>
    <clipPath id="swarm-clip"><rect x="4" y="4" width="56" height="56" rx="13"/></clipPath>
  </defs>
  <g clip-path="url(#swarm-clip)">
    <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#swarm-bg)"/>
    <!-- blueprint grid -->
    <g stroke="#5B8CFF" stroke-opacity="0.13" stroke-width="0.7">
      <path d="M4 18h56 M4 32h56 M4 46h56 M18 4v56 M32 4v56 M46 4v56"/>
    </g>
    <!-- ghost browser chrome -->
    <rect x="10" y="11" width="44" height="42" rx="3.5" fill="none" stroke="#8ea7d8" stroke-opacity="0.55" stroke-width="1.3"/>
    <path d="M10 18.5h44" stroke="#8ea7d8" stroke-opacity="0.4" stroke-width="1.1"/>
    <circle cx="14" cy="14.6" r="1.2" fill="#EC4899"/>
    <circle cx="18" cy="14.6" r="1.2" fill="#F59E0B"/>
    <circle cx="22" cy="14.6" r="1.2" fill="#10B981"/>
    <!-- built blocks -->
    <rect x="14" y="22" width="20" height="4" rx="1.6" fill="#5B8CFF" fill-opacity="0.9"/>
    <rect x="14" y="28.5" width="15" height="2.6" rx="1.2" fill="#8B5CF6" fill-opacity="0.85"/>
    <rect x="14" y="33.5" width="11" height="2.6" rx="1.2" fill="#8ea7d8" fill-opacity="0.6"/>
    <rect x="14" y="39" width="9" height="4.6" rx="2" fill="#10B981" fill-opacity="0.9"/>
    <rect x="38" y="22" width="12" height="15" rx="2" fill="#06B6D4" fill-opacity="0.5"/>
    <!-- block being assembled (dashed) -->
    <rect x="38" y="40" width="12" height="8" rx="1.6" fill="none" stroke="#F59E0B" stroke-width="1.3" stroke-dasharray="2.5 2"/>
    <!-- three labeled swarm cursors -->
    <g transform="translate(31 27) rotate(-12)">
      <path d="M0 0 L0 13 L3.4 9.6 L5.6 15 L7.8 14 L5.7 8.7 L10.5 8.6 Z" fill="#EC4899" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/>
    </g>
    <g transform="translate(46 35) rotate(14)">
      <path d="M0 0 L0 11 L2.9 8.2 L4.7 12.8 L6.6 12 L4.8 7.5 L9 7.4 Z" fill="#F59E0B" stroke="#fff" stroke-width="1" stroke-linejoin="round"/>
    </g>
    <g transform="translate(11 43) rotate(-22)">
      <path d="M0 0 L0 10 L2.7 7.4 L4.4 11.6 L6.2 10.8 L4.5 6.8 L8.3 6.7 Z" fill="#10B981" stroke="#fff" stroke-width="1" stroke-linejoin="round"/>
    </g>
    <!-- sparkle -->
    <g fill="#FDE68A">
      <path d="M41 20 l1 2.4 2.4 1 -2.4 1 -1 2.4 -1 -2.4 -2.4 -1 2.4 -1 z"/>
      <circle cx="34" cy="45" r="1"/>
      <circle cx="52" cy="27" r="0.9"/>
    </g>
  </g>
</svg>
